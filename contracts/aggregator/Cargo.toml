[package]
name = "aphelion-aggregator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# The registry is registered alongside the aggregator in the integration tests
# so that the pair is exercised for real rather than against a stub.
aphelion-registry = { path = "../registry" }
ed25519-dalek = { workspace = true }
serde_json = { workspace = true }
