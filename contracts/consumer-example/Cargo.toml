[package]
name = "aphelion-consumer-example"
description = "Reference integration: how a lending protocol should read Aphelion."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# The tests run against the real registry and aggregator rather than a mock
# oracle: a mock agrees with whatever this contract already believes.
aphelion-aggregator = { path = "../aggregator" }
aphelion-registry = { path = "../registry" }
ed25519-dalek = { workspace = true }
