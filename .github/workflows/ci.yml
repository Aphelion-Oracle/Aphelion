# Continuous integration.
#
# The jobs are split by what a failure means rather than by what is convenient
# to run together. `consensus-vectors` is separate from `test` because a drift
# between the off-chain and on-chain implementations of the signing payload or
# the aggregation maths is a consensus break, not a failing test, and it should
# be legible as such on the pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Deliberately no global `RUSTFLAGS: -D warnings`: it applies to dependency
  # compilation too, so an upstream crate emitting a warning under a new
  # compiler would fail this repository's build for a reason nobody here can
  # fix. Denials belong on the clippy invocation, where they apply to our code.

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path contracts/Cargo.toml --all --check

  clippy:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --manifest-path contracts/Cargo.toml --all-targets -- -D warnings

  test:
    name: Off-chain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  harness:
    name: Multi-process harness
    runs-on: ubuntu-latest
    # Its own job because a failure here means something different from a unit
    # test failing: the node's logic is fine and the way several of them behave
    # together is not. It is also the only job that needs a database, and
    # attaching one to the fast suite would slow down the check people wait on.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aphelion
          POSTGRES_PASSWORD: aphelion
          POSTGRES_DB: aphelion
        ports:
          - 5432:5432
        # Without this the harness races the container and reports "cannot
        # reach Postgres", which reads as a broken test rather than a slow start.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      # Built explicitly so a compile failure is reported as one, rather than
      # as the harness timing out waiting for a node that was never going to
      # start. The harness would build it on demand otherwise.
      - run: cargo build -p aphelion-node --bin aphelion-node
      - name: Several node processes against one deployment
        env:
          APHELION_TEST_DATABASE_URL: postgres://aphelion:aphelion@localhost:5432/aphelion
        # Serialised inside the harness regardless; saying so here keeps the
        # runner from starting six of them before the lock is taken.
        run: cargo test -p aphelion-harness -- --test-threads=1

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo test --manifest-path contracts/Cargo.toml

  wasm:
    name: Contract wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Build every contract for the ledger
        run: |
          cargo build --manifest-path contracts/Cargo.toml \
            --target wasm32v1-none --release
      - name: Report sizes
        run: |
          echo "### Contract wasm sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract | Bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          for f in contracts/target/wasm32v1-none/release/*.wasm; do
            printf '| %s | %s |\n' "$(basename "$f")" "$(stat -c%s "$f")" \
              >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: contracts/target/wasm32v1-none/release/*.wasm
          if-no-files-found: error

  consensus-vectors:
    name: Consensus vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate from the independent implementation
        run: python3 scripts/gen_test_vectors.py
      - name: The committed vectors must match what the generator produces
        run: |
          if ! git diff --quiet -- tests/vectors; then
            echo "::error::The committed test vectors do not match" \
                 "scripts/gen_test_vectors.py."
            echo "A change to the signing payload or the aggregation maths is" \
                 "consensus-breaking: regenerate the vectors in the same commit."
            git --no-pager diff -- tests/vectors
            exit 1
          fi

  audit:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
