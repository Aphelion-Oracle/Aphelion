# Alerts an Aphelion operator actually wants to be woken for.
#
# Each one is scoped to a condition that costs the operator money, reputation or
# both. Deliberately absent: alerts on individual source fetch failures, which
# happen constantly as exchanges rate-limit and would train the on-call to
# ignore the channel.

groups:
  - name: aphelion-node
    rules:
      - alert: AphelionNodeNotSubmitting
        # Two heartbeats of silence. One missed heartbeat can be a slow ledger;
        # two is a pattern, and reputation is already eroding by then.
        expr: aphelion_seconds_since_submission > 600
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No submission for {{ $labels.feed }} in {{ $value | humanizeDuration }}"
          description: >-
            The node has not landed a price for this feed. Reputation decays on
            missed rounds. Check /health and /v1/rounds on the node.

      - alert: AphelionClockSkew
        # A skewed clock produces submissions the contract rejects outright, so
        # the node burns a fee per round discovering that.
        expr: abs(aphelion_clock_skew_seconds) > 20
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node clock is {{ $value }}s from ledger time"
          description: "Check NTP. Beyond max_clock_skew the node stops signing entirely."

      - alert: AphelionReputationFalling
        expr: aphelion_reputation < 4000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node reputation is {{ $value }}"
          description: >-
            Below 3000 the node is jailed and its submissions carry zero weight.
            Investigate whether its prices are diverging from the network.

      - alert: AphelionSourcesDisagreeing
        # The single best early warning that something is wrong upstream.
        expr: aphelion_source_spread_bps > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sources for {{ $labels.feed }} disagree by {{ $value }} bps"
          description: >-
            Either a venue is publishing bad data, or the market is genuinely
            dislocated. Check /v1/prices/{{ $labels.feed }} for the breakdown.

      - alert: AphelionSubmissionsFailing
        expr: rate(aphelion_submissions_total{outcome="error"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Submissions failing for {{ $labels.feed }}"
          description: "Check RPC reachability, the submitter account's balance, and node registration."

      - alert: AphelionUnearnedWeight
        # Not a fault in this node, and deliberately a warning rather than a
        # page: it is weight held by *other* nodes that have stopped earning it,
        # which still counts towards every median. sweep_absent removes it and
        # anyone may call it, so a figure that stays up means nobody is.
        expr: aphelion_sweep_candidates > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} node(s) carrying weight they have stopped earning"
          description: >-
            These nodes are silent past the aggregator's absence threshold and
            still voting at full weight. Charge them with
            `aphelion-node sweep --commit`, or set upkeep.sweep_absent to have
            this node do it continuously. See /v1/upkeep for the list.

      - alert: AphelionDisputeAgainstThisNode
        # The one alert on this list with a deadline attached to it. A dispute
        # is answered by evidence and argument off chain, and an appeal window
        # that closes is not reopened — so this pages rather than warns, and it
        # does so as soon as the watcher sees it rather than after a `for:`.
        # The false-positive cost is one message; the false-negative cost is
        # the node's stake.
        expr: aphelion_duties_outstanding{consequence="costly"} > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} thing(s) that can cost this node stake"
          description: >-
            A dispute against this node is being voted on, or one was upheld
            and its appeal window is still open. Run `aphelion-node duties`, or
            read /v1/duties, for the allegation, the evidence link and the
            deadline.

      - alert: AphelionDutyDeadlineClosing
        # Separately, and louder, when the window is nearly gone. A node that
        # has been paging for two days is a node whose pages are being muted.
        expr: aphelion_duty_deadline_seconds < 21600
        labels:
          severity: critical
        annotations:
          summary: "A window that costs stake closes in {{ $value | humanizeDuration }}"
          description: >-
            Ledger time, not wall clock. Once it passes, the finding stands and
            cannot be contested. See /v1/duties.

      - alert: AphelionVoteOutstanding
        # A warning, not a page: nothing is taken from this operator by not
        # voting. What is lost is a say — in a committee seat this operator
        # stood for, or in a dispute the committee cannot resolve without
        # quorum. `for: 12h` because a committee member is entitled to think
        # about it.
        expr: aphelion_duties_outstanding{consequence="forfeited"} > 0
        for: 12h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} vote(s) this operator has not cast"
          description: >-
            A committee vote on an open dispute, or a ballot in a running
            election. A dispute short of quorum is dismissed whatever the
            evidence, so an absent committee is how slashing switches itself
            off. See /v1/duties.
