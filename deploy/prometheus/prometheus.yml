global:
  # Matches the node's default round interval, so a scrape lands in every round.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aphelion-node
    metrics_path: /metrics
    static_configs:
      - targets: ["node:8080"]
        labels:
          network: testnet
